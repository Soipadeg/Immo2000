[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --asyncio-mode=auto
asyncio_mode = auto
markers =
    slow: marque les tests comme lents
    integration: teste l'intégration avec services externes
    unit: teste unitaires
    asyncio: teste asynchrones
    webhook: teste des webhooks
    auth: teste l'authentification
filterwarnings =
    ignore::DeprecationWarning
