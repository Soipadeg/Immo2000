<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching - Immo2000</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/chatbot.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar Component Loader -->
    <script src="/static/js/navbar-component-loader.js"></script>

    <main>
        <div class="container mt-4">
            <!-- Page Title -->
            <h1 class="mb-4">
                <i class="fas fa-handshake"></i> Matching Intelligent
            </h1>

            <!-- Error Message -->
            <div id="errorMessage"></div>

            <!-- Loading Message -->
            <div id="loadingMessage" class="loading-message">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
                <p class="mt-2">Recherche des biens correspondants...</p>
            </div>

            <div class="row">
                <!-- Filters Sidebar -->
                <div class="col-md-3 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-filter"></i> Filtres</h5>
                        </div>
                        <div class="card-body">
                            <form id="filterForm">
                                <!-- City Filter -->
                                <div class="form-group mb-3">
                                    <label for="city" class="form-label">Ville</label>
                                    <input type="text" class="form-control" id="city" name="city" placeholder="Entrez une ville">
                                </div>

                                <!-- Budget Filter -->
                                <div class="form-group mb-3">
                                    <label for="budgetMax" class="form-label">Budget maximum</label>
                                    <input type="number" class="form-control" id="budgetMax" name="budget_max" placeholder="€" min="0">
                                </div>

                                <!-- Surface Filter -->
                                <div class="form-group mb-3">
                                    <label for="surfaceMin" class="form-label">Surface minimale (m²)</label>
                                    <input type="number" class="form-control" id="surfaceMin" name="surface_min" placeholder="m²" min="0">
                                </div>

                                <!-- Property Type Filter -->
                                <div class="form-group mb-3">
                                    <label for="propertyType" class="form-label">Type de bien</label>
                                    <select class="form-select" id="propertyType" name="property_type">
                                        <option value="">-- Tous les types --</option>
                                        <option value="Maison">Maison</option>
                                        <option value="Appartement">Appartement</option>
                                        <option value="Terrain">Terrain</option>
                                        <option value="Immeuble">Immeuble</option>
                                    </select>
                                </div>

                                <!-- Buttons -->
                                <button type="submit" class="btn btn-primary w-100 mb-2">
                                    <i class="fas fa-search"></i> Rechercher
                                </button>
                                <button type="reset" class="btn btn-secondary w-100">
                                    <i class="fas fa-redo"></i> Réinitialiser
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Results -->
                <div class="col-md-9">
                    <!-- Results Header -->
                    <div class="mb-3 d-flex justify-content-between align-items-center">
                        <h5>Résultats : <span id="resultCount">0</span> bien(s)</h5>
                    </div>

                    <!-- Results List -->
                    <div id="resultsList" class="row">
                        <div class="col-12">
                            <div class="no-results">
                                <i class="fas fa-search"></i>
                                <p class="mt-2">Lancez une recherche pour voir les biens disponibles</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 immo2000. Tous droits réservés.</p>
            <p>
                <a href="legal/cgu.html">CGU</a> |
                <a href="legal/politique-confidentialite.html">Politique de Confidentialité</a> |
                <a href="faq.html">FAQ</a> |
                <a href="guides.html">Guides</a> |
                <a href="modeles.html">Modèles</a> |
                <a href="outils.html">Outils</a>
            </p>
        </div>
    </footer>

    <!-- Modal pour afficher les détails des annonces -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="messageModalLabel">Détails</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="messageModalBody">
                    <!-- Contenu généré dynamiquement -->
                </div>
            </div>
        </div>
    </div>

    <!-- Chatbot -->
    <div class="chatbot-container">
        <button class="chatbot-toggle" id="chatbotToggle">
            <i class="fas fa-comments"></i>
        </button>
        <div class="chatbot-window" id="chatbotWindow">
            <div class="chatbot-header">
                <h5><i class="fas fa-robot me-2"></i>Chatbot Immo2000</h5>
                <button class="chatbot-close" id="chatbotClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages"></div>
            <div class="chatbot-input">
                <input type="text" id="chatbotInput" placeholder="Posez votre question..." autocomplete="off">
                <button id="chatbotSend"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/chatbot.js"></script>
    <script src="/static/js/matching.js"></script>
</body>
</html>
