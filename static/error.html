<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur - Immo2000</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-home"></i> Immo2000
            </a>
        </div>
    </nav>

    <main>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <div class="no-results">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h1 class="mt-3 mb-3">Oups !</h1>
                        <p class="lead mb-4">Cette page n'existe pas encore ou n'est pas accessible.</p>

                        <div class="alert alert-info">
                            <p><strong>Code erreur : <span id="errorCode">404</span></strong></p>
                            <p class="mb-0">Message : <span id="errorMessage">Page non trouvée</span></p>
                        </div>

                        <div class="mt-4">
                            <a href="index.html" class="btn btn-primary btn-lg">
                                <i class="fas fa-home"></i> Retour à l'accueil
                            </a>
                        </div>

                        <hr class="my-4">

                        <h5>Vous cherchez quelque chose ?</h5>
                        <div class="row mt-3">
                            <div class="col-md-4">
                                <a href="matching.html" class="btn btn-outline-primary btn-sm w-100 mb-2">
                                    <i class="fas fa-search"></i> Trouver un bien
                                </a>
                            </div>
                            <div class="col-md-4">
                                <a href="simulateur_pret.html" class="btn btn-outline-primary btn-sm w-100 mb-2">
                                    <i class="fas fa-calculator"></i> Simulateur
                                </a>
                            </div>
                            <div class="col-md-4">
                                <a href="dashboard.html" class="btn btn-outline-primary btn-sm w-100 mb-2">
                                    <i class="fas fa-tachometer-alt"></i> Tableau de bord
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Immo2000. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Affiche le code d'erreur à partir des paramètres de l'URL
            const errorCode = getQueryParam('code') || '404';
            const errorMsg = getQueryParam('message') || 'Page non trouvée';

            document.getElementById('errorCode').textContent = errorCode;
            document.getElementById('errorMessage').textContent = errorMsg;
        });
    </script>
</body>
</html>
