<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Immo2000</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/chatbot.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-home"></i> Immo2000
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Accueil</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="mb-0"><i class="fas fa-sign-in-alt"></i> Connexion</h4>
                        </div>
                        <div class="card-body">
                            <!-- Error Message -->
                            <div id="errorMessage"></div>

                            <!-- Login Form -->
                            <form id="loginForm">
                                <div class="form-group mb-3">
                                    <label for="email" class="form-label">Adresse email</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                    <small class="form-text">Entrez votre adresse email</small>
                                </div>

                                <div class="form-group mb-3">
                                    <label for="password" class="form-label">Mot de passe</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                    <small class="form-text">Minimum 6 caractères</small>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mb-3">
                                    <i class="fas fa-sign-in-alt"></i> Se connecter
                                </button>
                            </form>

                            <!-- Loading Spinner -->
                            <div id="loadingMessage" class="loading-message">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Chargement...</span>
                                </div>
                                <p class="mt-2">Connexion en cours...</p>
                            </div>
                        </div>

                        <div class="card-footer bg-light">
                            <p class="mb-0">Pas encore de compte ? <a href="register.html" class="text-primary fw-bold">Créer un compte</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Immo2000. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- Chatbot -->
    <div class="chatbot-container">
        <button class="chatbot-toggle" id="chatbotToggle">
            <i class="fas fa-comments"></i>
        </button>
        <div class="chatbot-window" id="chatbotWindow">
            <div class="chatbot-header">
                <h5><i class="fas fa-robot me-2"></i>Chatbot Immo2000</h5>
                <button class="chatbot-close" id="chatbotClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages"></div>
            <div class="chatbot-input">
                <input type="text" id="chatbotInput" placeholder="Posez votre question..." autocomplete="off">
                <button id="chatbotSend"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/chatbot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Validation
                if (!validateEmail(email)) {
                    showErrorMessage('Veuillez entrer une adresse email valide');
                    return;
                }

                if (!validatePassword(password)) {
                    showErrorMessage('Le mot de passe doit contenir au moins 6 caractères');
                    return;
                }

                // Affiche le spinner
                showLoadingSpinner();
                errorMessage.innerHTML = '';

                try {
                    const response = await axios.post('/login', {
                        email: email,
                        password: password
                    });

                    // Stocke le token et l'utilisateur
                    setUser(response.data.user, response.data.token);

                    // Redirection vers le tableau de bord
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    hideLoadingSpinner();
                    let errorText = 'Erreur lors de la connexion. Veuillez réessayer.';

                    if (error.response) {
                        errorText = error.response.data.message || 'Identifiants invalides';
                    }

                    showErrorMessage(errorText);
                } finally {
                    loginForm.reset();
                }
            });
        });
    </script>
</body>
</html>
