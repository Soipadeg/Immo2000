version: '3.9'

services:
  # ========== SENTRY ==========
  sentry-postgres:
    image: postgres:15
    container_name: sentry-postgres
    environment:
      POSTGRES_PASSWORD: sentry
      POSTGRES_USER: sentry
      POSTGRES_DB: sentry
    volumes:
      - sentry_postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring

  sentry-redis:
    image: redis:7-alpine
    container_name: sentry-redis
    networks:
      - monitoring

  sentry:
    image: sentry:latest
    container_name: sentry
    depends_on:
      - sentry-postgres
      - sentry-redis
    environment:
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_POSTGRES_USER: sentry
      SENTRY_POSTGRES_PASSWORD: sentry
      SENTRY_POSTGRES_DB: sentry
      SENTRY_REDIS_HOST: sentry-redis
      SENTRY_REDIS_PORT: 6379
      SENTRY_SECRET_KEY: your-secret-key-here
      SENTRY_SINGLE_ORGANIZATION: true
      SENTRY_INITIAL_TEAM_ID: 1
      SENTRY_INITIAL_PROJECT_ID: 1
      SENTRY_INITIAL_PLATFORM: python
    ports:
      - "9000:9000"
    networks:
      - monitoring

  # ========== JAEGER TRACING ==========
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "6831:6831/udp"  # Jaeger agent
      - "16686:16686"    # Jaeger UI
      - "14250:14250"    # gRPC
    networks:
      - monitoring

  # ========== ELK STACK ==========
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - monitoring

  kibana:
    image: docker.elastic.co/kibana/kibana:8.0.0
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - monitoring

  logstash:
    image: docker.elastic.co/logstash/logstash:8.0.0
    container_name: logstash
    volumes:
      - ./devops/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    depends_on:
      - elasticsearch
    networks:
      - monitoring

  # ========== PROMETHEUS ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./devops/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring

  # ========== GRAFANA ==========
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ========== REDIS (for metrics aggregation) ==========
  redis-monitoring:
    image: redis:7-alpine
    container_name: redis-monitoring
    ports:
      - "6380:6379"
    volumes:
      - redis_monitoring_data:/data
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  sentry_postgres_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  redis_monitoring_data:
