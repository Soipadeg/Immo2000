version: '3.8'

services:
  # ===== DATABASE =====
  postgres:
    image: postgres:15-alpine
    container_name: immo2000-db
    environment:
      POSTGRES_USER: immo2000
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: immo2000
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/immo2000_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo2000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immo2000

  # ===== CACHE =====
  redis:
    image: redis:7-alpine
    container_name: immo2000-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immo2000

  # ===== FASTAPI BACKEND =====
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: immo2000-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://immo2000:secure_password_123@postgres:5432/immo2000
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
      FLASK_ENV: production
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - immo2000
    restart: unless-stopped

  # ===== FRONTEND =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: immo2000-web
    depends_on:
      - fastapi
    environment:
      VITE_API_URL: http://fastapi:8000/api/v1
      VITE_APP_NAME: Immo2000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - immo2000
    restart: unless-stopped

  # ===== NGINX REVERSE PROXY =====
  nginx:
    image: nginx:alpine
    container_name: immo2000-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./devops/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/ssl:/etc/nginx/ssl:ro
    depends_on:
      - fastapi
      - frontend
    networks:
      - immo2000
    restart: unless-stopped

  # ===== MONITORING & LOGGING =====
  prometheus:
    image: prom/prometheus:latest
    container_name: immo2000-prometheus
    volumes:
      - ./devops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - immo2000

  grafana:
    image: grafana/grafana:latest
    container_name: immo2000-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - immo2000

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  immo2000:
    driver: bridge
