# Alert rules for Immo2000 Production Environment

groups:
  - name: immo2000_production
    interval: 30s
    rules:
      # ========== ERROR RATE ALERTS ==========
      - alert: HighErrorRate
        expr: |
          (sum(increase(http_requests_total{status=~"5.."}[5m]))
           / sum(increase(http_requests_total[5m]))) * 100 > 5
        for: 5m
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }}% (threshold: 5%)"

      # ========== RESPONSE TIME ALERTS ==========
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        annotations:
          summary: "Slow API response time"
          description: "P95 response time is {{ $value | humanize }}s"

      # ========== DATABASE ALERTS ==========
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            sum(rate(db_query_duration_seconds_bucket[5m])) by (le)
          ) > 0.1
        for: 5m
        annotations:
          summary: "Slow database queries detected"
          description: "P95 query time is {{ $value | humanize }}s"

      - alert: HighDatabaseConnections
        expr: |
          pg_stat_activity_count > 80
        for: 5m
        annotations:
          summary: "High database connections"
          description: "Active connections: {{ $value }}"

      # ========== RESOURCE ALERTS ==========
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanize }}%"

      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanize }}%"

      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{fstype=~"ext4|xfs"} /
           node_filesystem_size_bytes{fstype=~"ext4|xfs"}) * 100 < 10
        for: 5m
        annotations:
          summary: "Low disk space"
          description: "Available space: {{ $value | humanize }}%"

      # ========== CACHE ALERTS ==========
      - alert: LowCacheHitRate
        expr: |
          (cache_hits / (cache_hits + cache_misses)) < 0.7
        for: 10m
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"

      # ========== SERVICE AVAILABILITY ==========
      - alert: ServiceDown
        expr: |
          up{job="immo2000-backend"} == 0
        for: 1m
        annotations:
          summary: "Service is down"
          description: "{{ $labels.instance }} is unreachable"

      - alert: DatabaseDown
        expr: |
          pg_up == 0
        for: 1m
        annotations:
          summary: "Database is down"
          description: "PostgreSQL is unreachable"

      - alert: RedisDown
        expr: |
          redis_up == 0
        for: 1m
        annotations:
          summary: "Redis is down"
          description: "Redis cache is unreachable"

      # ========== SENTRY ALERTS ==========
      - alert: SentryHighErrorVolume
        expr: |
          increase(sentry_events_total[1h]) > 100
        for: 5m
        annotations:
          summary: "High error volume in Sentry"
          description: "{{ $value }} errors in last hour"

      # ========== WEB VITALS ALERTS ==========
      - alert: HighLCP
        expr: |
          histogram_quantile(0.75, web_vital_lcp) > 2.5
        for: 5m
        annotations:
          summary: "High Largest Contentful Paint"
          description: "LCP is {{ $value | humanize }}ms"

      - alert: HighCLS
        expr: |
          histogram_quantile(0.75, web_vital_cls) > 0.1
        for: 5m
        annotations:
          summary: "High Cumulative Layout Shift"
          description: "CLS is {{ $value }}"
