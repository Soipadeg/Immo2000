# devops/logstash.conf

input {
  # TCP input for application logs (JSON)
  tcp {
    host => "0.0.0.0"
    port => 5000
    codec => json
    type => "app_logs"
  }

  # UDP input for syslog
  udp {
    host => "0.0.0.0"
    port => 5000
    type => "syslog"
  }

  # Flask application logs
  tcp {
    host => "0.0.0.0"
    port => 5001
    codec => json
    type => "flask"
  }

  # Error logs
  tcp {
    host => "0.0.0.0"
    port => 5002
    codec => json
    type => "error"
  }
}

filter {
  # JSON parsing
  if [type] == "app_logs" or [type] == "flask" or [type] == "error" {
    json {
      source => "message"
    }
  }

  # Add metadata
  mutate {
    add_field => {
      "[@metadata][index_name]" => "immo2000-%{[type]}-%{+YYYY.MM.dd}"
    }
  }

  # Parse timestamps
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  # Extract user_id if present
  if [user_id] {
    mutate {
      add_field => { "user_id_extracted" => "%{user_id}" }
    }
  }

  # Extract request_id if present
  if [request_id] {
    mutate {
      add_field => { "request_id_extracted" => "%{request_id}" }
    }
  }

  # Parse duration
  if [duration_ms] {
    mutate {
      convert => { "duration_ms" => "integer" }
    }
  }

  # Grok patterns for common log formats
  grok {
    match => {
      "message" => "%{COMMONAPACHELOG}"
    }
    add_tag => [ "parsed" ]
    tag_on_failure => []
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    document_type => "_doc"
  }

  # Also send to stdout for debugging (remove in production)
  stdout {
    codec => rubydebug
  }
}
