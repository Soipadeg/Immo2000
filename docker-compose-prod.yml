version: '3.9'

# Production-ready Docker Compose configuration for Immo2000
# Usage: docker-compose -f docker-compose-prod.yml up -d

services:
  # PostgreSQL Database - Production Configuration
  postgres:
    image: postgres:15-alpine
    container_name: immo2000_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-immo2000}
      POSTGRES_USER: ${DB_USER:-immo2000}
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # MUST be set in .env.production
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --max_connections=100"
    # Don't expose port directly - use connection pooling through backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
      - ./backups:/backups  # Mount backups directory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-immo2000}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immo2000_network
    security_opt:
      - no-new-privileges:true

  # Redis Cache - Production Configuration
  redis:
    image: redis:7-alpine
    container_name: immo2000_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"  # Only accessible from localhost
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immo2000_network
    security_opt:
      - no-new-privileges:true

  # Flask Backend API - Production Configuration
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immo2000_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Environment Type
      FLASK_ENV: production
      FLASK_APP: src.app

      # Database Configuration
      DATABASE_URL: postgresql://${DB_USER:-immo2000}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-immo2000}
      SQLALCHEMY_DATABASE_URI: postgresql://${DB_USER:-immo2000}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-immo2000}
      DB_POOL_SIZE: 20
      DB_POOL_RECYCLE: 3600

      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Security - Secrets MUST be set in .env.production
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # CORS Configuration - Restricted to production domains
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # API Configuration
      API_TITLE: Immo2000 API
      API_VERSION: 6.0.0
      API_DESCRIPTION: Production API

      # Logging & Monitoring
      LOG_LEVEL: INFO
      ENABLE_CACHE: true
      ENABLE_MONITORING: true
      ENABLE_AUDIT_LOGGING: true
      ENABLE_2FA: true
      ENABLE_HTTPS: true

      # Email Configuration
      EMAIL_SMTP_SERVER: ${EMAIL_SMTP_SERVER}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}

      # Integrations
      SENTRY_DSN: ${SENTRY_DSN}
      MELO_API_KEY: ${MELO_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}

    # Only expose internal port - use reverse proxy for external access
    expose:
      - "5000"

    volumes:
      - ./backend:/app/backend
      - ./static:/app/static
      - app_logs:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - immo2000_network

    security_opt:
      - no-new-privileges:true

    command: bash -c "
      cd /app/backend &&
      python -m flask db upgrade &&
      python -m flask run --host=0.0.0.0 --port=5000
    "

  # Frontend React/Vite - Production Build
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=https://${DOMAIN:-immo2000.fr}/api/v1
        - VITE_ENV=production
    container_name: immo2000_frontend_prod
    restart: always
    environment:
      - VITE_API_URL=https://${DOMAIN:-immo2000.fr}/api/v1

    expose:
      - "5173"

    volumes:
      - ./static:/app/dist

    networks:
      - immo2000_network

    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy + SSL Termination (Optional but Recommended)
  # nginx:
  #   image: nginx:alpine
  #   container_name: immo2000_nginx_prod
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./devops/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./devops/ssl:/etc/nginx/ssl:ro
  #     - ./static:/usr/share/nginx/html/static:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - immo2000_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local

networks:
  immo2000_network:
    driver: bridge
